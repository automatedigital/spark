name: python-quality

# Every PR gets coverage selection, including unclassified paths.
# Main and manual runs always use the full Python gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run on the same branch.
permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff>=0.9.0,<1"

      # F, B, I and W are fully clear.  B027 is a documented permanent ignore
      # (see pyproject) and must be repeated here because an explicit --select
      # on the command line bypasses the config ignore list.
      - name: Enforce cleaned ruff rule families
        run: ruff check src/ --select UP015,F,B,I,W,UP028,UP031,UP035,UP037,UP042 --ignore B027

  mypy-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Spark with dev and web extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"

      # The modules still carrying type errors are listed in the
      # tool.mypy.overrides block in pyproject.  Everything else is clean, so
      # this fails if a new error appears in an already-clean module.
      - name: Type-check the clean modules
        run: mypy src/agent/ src/spark_cli/

  pytest:
    needs: ruff-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EARLY_CRON_TEST: tests/cron/test_history.py::test_same_second_outputs_keep_distinct_history_links
      EARLY_RECOVERY_TESTS: tests/run_agent/test_primary_runtime_restore.py::TestTryRecoverPrimaryTransport
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Select Python coverage
        id: coverage
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/select_python_ci.py --base "$PR_BASE" --output "$GITHUB_OUTPUT"

      # The [web] extra is required, not optional, for the test suite: the
      # workflow io nodes import spark_cli.workspace_routes, which imports
      # FastAPI, so without it ~576 tests fail with ModuleNotFoundError.
      - name: Install Spark with dev and web extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"

      # Run these fast contracts before collecting the full suite. Reuse the
      # same node IDs below to keep each test in exactly one fast pass.
      - name: Check cron output and transport recovery first
        if: steps.coverage.outputs.scope == 'full'
        env:
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: >-
          python -m pytest "$EARLY_CRON_TEST" "$EARLY_RECOVERY_TESTS"
          -m "not serial and not slow and not integration and not network" -q --timeout=60 -n 0

      - name: Verify generated built-in tool schemas
        run: python scripts/generate_tool_manifest.py --check

      # A command-line -m replaces pytest's configured marker expression, so
      # retain the integration and network exclusions explicitly. Otherwise this job can run tests
      # that touch configured external services.
      - name: Run selected fast tests
        if: steps.coverage.outputs.scope != 'full'
        env:
          OPENAI_API_KEY: sk-test-not-a-real-key
          PYTEST_TARGETS: ${{ steps.coverage.outputs.targets }}
        run: |
          read -r -a targets <<< "$PYTEST_TARGETS"
          python -m pytest "${targets[@]}" -m "not serial and not slow and not integration and not network" -q --timeout=60 -n 4
          python -m pytest "${targets[@]}" -m "serial and not slow and not integration and not network" -q --timeout=60 -n 0

      - name: Run non-serial fast tests in parallel
        if: steps.coverage.outputs.scope == 'full'
        env:
          # Some tests construct a client at import/init time and only need a
          # syntactically valid key; no request is ever sent (integration
          # tests are deselected).
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: >-
          python -m pytest tests/ --deselect="$EARLY_CRON_TEST" --deselect="$EARLY_RECOVERY_TESTS"
          -m "not serial and not slow and not integration and not network" -q --timeout=60 -n 4

      - name: Run serial fast tests without xdist
        if: steps.coverage.outputs.scope == 'full'
        env:
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: python -m pytest tests/ -m "serial and not slow and not integration and not network" -q --timeout=60 -n 0

      # The browser job formerly repeated 25 backend modules. Fast cases are
      # already covered above; retain its two slow ownership contracts here.
      - name: Slow worktree and worker ownership contracts
        run: >-
          python -m pytest tests/tools/test_subagent_worktree.py
          tests/core/test_kanban_worker_ownership.py
          -m "slow and not integration and not network" -q -n 0
