name: python-quality

on:
  push:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"

jobs:
  ruff-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff>=0.9.0,<1"

      # The ignore list is the remaining debt.  Clear a rule, then delete it
      # from this list so it can never regress.
      - name: Enforce cleaned ruff rule families
        run: >-
          ruff check src/
          --select UP015,F,B
          --ignore B904,B007,B027,B905,B008,F401,F841

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Spark with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Integration tests are already deselected by the addopts in
      # pyproject.toml; -m "not slow" keeps this job under the timeout.
      - name: Run the fast test suite
        run: python -m pytest tests/ -m "not slow" -q --timeout=60
