name: python-quality

# Runs on pull requests, and on pushes to main only.  Previously every push
# to a PR branch triggered a second, identical run of the same commit.
on:
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"

# A new push supersedes the previous run on the same branch.
concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff>=0.9.0,<1"

      # The ignore list is the remaining debt.  Clear a rule, then delete it
      # from this list so it can never regress.
      - name: Enforce cleaned ruff rule families
        run: >-
          ruff check src/
          --select UP015,F,B
          --ignore B904,B027,F401

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The [web] extra is required, not optional, for the test suite: the
      # workflow io nodes import spark_cli.workspace_routes, which imports
      # FastAPI, so without it ~576 tests fail with ModuleNotFoundError.
      - name: Install Spark with dev and web extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"

      # Integration tests are already deselected by the addopts in
      # pyproject.toml; -m "not slow" keeps this job under the timeout.
      - name: Run the fast test suite
        env:
          # Some tests construct a client at import/init time and only need a
          # syntactically valid key; no request is ever sent (integration
          # tests are deselected).
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: python -m pytest tests/ -m "not slow" -q --timeout=60
