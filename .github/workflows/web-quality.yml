name: web-quality

on:
  push:
    branches: [main]
    paths:
      - "src/spark_cli/**"
      - "src/core/**"
      - "src/agent/**"
      - "src/tools/**"
      - "src/gateway/**"
      - "src/cron/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/generate_tool_manifest.py"
      - ".github/workflows/web-quality.yml"
  pull_request:
    paths:
      - "src/spark_cli/**"
      - "src/core/**"
      - "src/agent/**"
      - "src/tools/**"
      - "src/gateway/**"
      - "src/cron/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/generate_tool_manifest.py"
      - ".github/workflows/web-quality.yml"

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/spark_cli/web

jobs:
  lint-types-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/spark_cli/web/package-lock.json

      - name: Install with frozen lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npx vitest run

  # Drive a real browser against a real Python backend. These contracts cover
  # multi-chat isolation, refresh/reconnect, gateway restart, and persisted
  # history, so a failure must block the merge rather than report as advisory.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/spark_cli/web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # The suite spawns the Spark web server itself, so the backend and its
      # web extra have to be importable.
      - name: Install Spark
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]"

      - name: Backend lifecycle, profile, cache and discovery contracts
        working-directory: .
        run: |
          python -m pytest -q -n 0 -m "not integration and not network" \
            tests/run_agent/test_orchestration_replay.py \
            tests/run_agent/test_async_delegation.py \
            tests/run_agent/test_real_interrupt_subagent.py \
            tests/run_agent/test_caching_golden.py \
            tests/tools/test_subagent_worktree.py \
            tests/core/test_kanban_worker_ownership.py \
            tests/spark_cli/test_async_subagent_routes.py \
            tests/spark_cli/test_sidebar_metadata.py \
            tests/spark_cli/test_web_server_events.py \
            tests/test_web_turn_persistence.py tests/spark_cli/test_web_state.py \
            tests/spark_cli/test_web_projections.py \
            tests/test_model_tools_lazy_imports.py tests/tools/test_lazy_manifest.py \
            tests/test_minimal_startup.py
          python scripts/generate_tool_manifest.py --check

      - name: Install web dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # e2e/multi-chat.mjs defaults to <repo>/.venv/bin/python, which does not
      # exist on a runner; point it at the interpreter set up above.
      - name: Multi-chat end-to-end
        env:
          PYTHON: python
        run: npm run test:e2e

      - name: Chat contracts end-to-end
        env:
          PYTHON: python
        run: node ./e2e/chat-contracts.mjs

      - name: Recovery end-to-end
        env:
          PYTHON: python
        run: npm run test:e2e:recovery

      - name: Install draft acceptance browser
        run: |
          python -m pip install playwright==1.62.0
          # Python Playwright 1.62 uses a different browser cache key than the
          # Node package, so install its browser binary without apt dependencies.
          # The OS dependencies are already present from the earlier install.
          python -m playwright install chromium

      - name: Draft recovery end-to-end
        run: python ./e2e/work-recovery.py

      - name: Sidebar scale and ownership browser gate
        if: ${{ !cancelled() }}
        env:
          PYTHON: python
        run: node ./e2e/browser-gates.mjs --suite sidebar --repeat 3 --output-dir /tmp/spark-browser-gates/sidebar

      - name: Production-built draft and recovery browser gate
        if: ${{ !cancelled() }}
        env:
          PYTHON: python
        run: node ./e2e/browser-gates.mjs --suite production-recovery --output-dir /tmp/spark-browser-gates/production-recovery

      - name: Repeated 2000-row long-thread gate
        if: ${{ !cancelled() }}
        env:
          PYTHON: python
        run: node ./e2e/browser-gates.mjs --suite longthread --repeat 3 --output-dir /tmp/spark-browser-gates/longthread

      - name: Retain browser gate reports, failures and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gates-${{ github.run_attempt }}
          path: |
            /tmp/spark-browser-gates
            src/spark_cli/web/screenshots/work-recovery
          if-no-files-found: warn
          retention-days: 14
