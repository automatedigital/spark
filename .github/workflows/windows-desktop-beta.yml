name: Windows desktop beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-beta:
    name: Build unsigned Windows x64 beta
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/spark_cli/web/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/spark_cli/web/src-tauri

      - name: Install Spark and build dependencies
        run: python -m pip install -e ".[web,pty,messaging,dev]"

      - name: Build unsigned Windows beta
        shell: pwsh
        run: ./scripts/build_desktop_windows.ps1

      - name: Exercise packaged Windows lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $AppExe = Resolve-Path "src/spark_cli/web/src-tauri/target/release/spark.exe"
          $SmokeHome = Join-Path $env:RUNNER_TEMP "spark-packaged-acceptance"
          New-Item $SmokeHome -ItemType Directory -Force | Out-Null
          $env:SPARK_HOME = $SmokeHome
          $env:SPARK_WEB_FAKE_STREAMS = "1"

          function Wait-SparkDesktop {
            param([string]$PreviousInstance = "")
            for ($Attempt = 0; $Attempt -lt 120; $Attempt++) {
              try {
                $Status = Invoke-RestMethod "http://127.0.0.1:9119/api/status" -TimeoutSec 2
                if (
                  $Status.desktop -eq $true -and
                  $Status.desktop_platform -eq "windows" -and
                  $Status.server_instance_id -ne $PreviousInstance
                ) {
                  return $Status
                }
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
            }
            throw "Packaged Spark.exe did not expose a healthy Windows desktop backend"
          }

          $Desktop = $null
          try {
            $Desktop = Start-Process -FilePath $AppExe -PassThru
            $Before = Wait-SparkDesktop
            python scripts/desktop_runtime_acceptance.py `
              --base-url http://127.0.0.1:9119 `
              --phase prepare `
              --platform windows
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged Windows prepare acceptance failed"
            }

            taskkill /PID $Desktop.Id /T /F | Out-Null
            $Desktop.WaitForExit()
            $Desktop = Start-Process -FilePath $AppExe -PassThru
            $After = Wait-SparkDesktop -PreviousInstance $Before.server_instance_id
            python scripts/desktop_runtime_acceptance.py `
              --base-url http://127.0.0.1:9119 `
              --phase resume `
              --platform windows
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged Windows resume acceptance failed"
            }
          }
          finally {
            if ($Desktop -and -not $Desktop.HasExited) {
              taskkill /PID $Desktop.Id /T /F | Out-Null
            }
            Remove-Item $SmokeHome -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Read desktop version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content src/spark_cli/web/src-tauri/tauri.conf.json | ConvertFrom-Json
          "version=$($config.version)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows beta installer
        uses: actions/upload-artifact@v4
        with:
          name: Spark-Windows-Beta-${{ steps.version.outputs.version }}-x64-unsigned
          path: src/spark_cli/web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
