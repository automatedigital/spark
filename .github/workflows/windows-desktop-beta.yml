name: Windows desktop beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-beta:
    name: Build unsigned Windows x64 beta
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/spark_cli/web/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/spark_cli/web/src-tauri

      - name: Install Spark and build dependencies
        run: python -m pip install -e ".[web,pty,messaging,dev]"

      - name: Build unsigned Windows beta
        shell: pwsh
        run: ./scripts/build_desktop_windows.ps1

      - name: Exercise packaged Windows lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $AppExe = Resolve-Path "src/spark_cli/web/src-tauri/target/release/spark.exe"
          $SmokeHome = Join-Path $env:RUNNER_TEMP "spark-packaged-acceptance"
          New-Item $SmokeHome -ItemType Directory -Force | Out-Null
          $env:SPARK_HOME = $SmokeHome
          $env:SPARK_WEB_FAKE_STREAMS = "1"

          function Wait-SparkDesktop {
            param([string]$PreviousInstance = "")
            for ($Attempt = 0; $Attempt -lt 120; $Attempt++) {
              try {
                $Status = Invoke-RestMethod "http://127.0.0.1:9119/api/status" -TimeoutSec 2
                if (
                  $Status.desktop -eq $true -and
                  $Status.desktop_platform -eq "windows" -and
                  $Status.server_instance_id -ne $PreviousInstance
                ) {
                  return $Status
                }
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
            }
            throw "Packaged Spark.exe did not expose a healthy Windows desktop backend"
          }

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class ProcessSleep {
            [DllImport("ntdll.dll", SetLastError = true)]
            private static extern int NtSuspendProcess(IntPtr processHandle);
            [DllImport("ntdll.dll", SetLastError = true)]
            private static extern int NtResumeProcess(IntPtr processHandle);
            public static void Suspend(int pid) {
              using (var process = System.Diagnostics.Process.GetProcessById(pid)) {
                if (NtSuspendProcess(process.Handle) != 0) throw new Exception("NtSuspendProcess failed");
              }
            }
            public static void Resume(int pid) {
              using (var process = System.Diagnostics.Process.GetProcessById(pid)) {
                if (NtResumeProcess(process.Handle) != 0) throw new Exception("NtResumeProcess failed");
              }
            }
          }
          "@

          function Get-ProcessTreeIds {
            param([int]$RootPid)
            $Ids = [System.Collections.Generic.List[int]]::new()
            $Queue = [System.Collections.Generic.Queue[int]]::new()
            $Queue.Enqueue($RootPid)
            while ($Queue.Count -gt 0) {
              $Current = $Queue.Dequeue()
              $Ids.Add($Current)
              Get-CimInstance Win32_Process -Filter "ParentProcessId=$Current" | ForEach-Object {
                $Queue.Enqueue([int]$_.ProcessId)
              }
            }
            return $Ids.ToArray()
          }

          $Desktop = $null
          try {
            $LaunchWatch = [System.Diagnostics.Stopwatch]::StartNew()
            $Desktop = Start-Process -FilePath $AppExe -PassThru
            $Before = Wait-SparkDesktop
            $LaunchWatch.Stop()
            Write-Host ("Packaged Windows launch-to-ready: {0:N3} seconds" -f $LaunchWatch.Elapsed.TotalSeconds)
            python scripts/desktop_runtime_acceptance.py `
              --base-url http://127.0.0.1:9119 `
              --phase prepare `
              --platform windows
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged Windows prepare acceptance failed"
            }

            # Preserve the exact process tree while simulating the suspend/resume
            # portion of OS sleep/wake. SSE reconnect is exercised again after wake.
            $TreeIds = @(Get-ProcessTreeIds -RootPid $Desktop.Id)
            $ChildIds = @($TreeIds | Where-Object { $_ -ne $Desktop.Id })
            foreach ($PidToSuspend in $ChildIds) {
              [ProcessSleep]::Suspend($PidToSuspend)
            }
            [ProcessSleep]::Suspend($Desktop.Id)
            Start-Sleep -Seconds 3
            [ProcessSleep]::Resume($Desktop.Id)
            foreach ($PidToResume in $ChildIds) {
              [ProcessSleep]::Resume($PidToResume)
            }
            $AfterWake = Wait-SparkDesktop
            if ($AfterWake.server_instance_id -ne $Before.server_instance_id) {
              throw "Packaged Windows backend restarted during suspend/resume"
            }
            python scripts/desktop_runtime_acceptance.py `
              --base-url http://127.0.0.1:9119 `
              --phase prepare `
              --platform windows
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged Windows post-wake reconnect acceptance failed"
            }

            taskkill /PID $Desktop.Id /T /F | Out-Null
            $Desktop.WaitForExit()
            $RelaunchWatch = [System.Diagnostics.Stopwatch]::StartNew()
            $Desktop = Start-Process -FilePath $AppExe -PassThru
            $After = Wait-SparkDesktop -PreviousInstance $Before.server_instance_id
            $RelaunchWatch.Stop()
            Write-Host ("Packaged Windows relaunch-to-ready: {0:N3} seconds" -f $RelaunchWatch.Elapsed.TotalSeconds)
            python scripts/desktop_runtime_acceptance.py `
              --base-url http://127.0.0.1:9119 `
              --phase resume `
              --platform windows
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged Windows resume acceptance failed"
            }
          }
          finally {
            if ($Desktop -and -not $Desktop.HasExited) {
              try {
                taskkill /PID $Desktop.Id /T /F | Out-Null
              }
              catch {
                Write-Host "Packaged desktop process tree already exited during cleanup"
              }
              $global:LASTEXITCODE = 0
            }
            Remove-Item $SmokeHome -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Read desktop version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content src/spark_cli/web/src-tauri/tauri.conf.json | ConvertFrom-Json
          "version=$($config.version)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows beta installer
        uses: actions/upload-artifact@v4
        with:
          name: Spark-Windows-Beta-${{ steps.version.outputs.version }}-x64-unsigned
          path: src/spark_cli/web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
