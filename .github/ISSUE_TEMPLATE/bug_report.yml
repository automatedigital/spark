name: Bug report
description: Something does not work as documented.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell what you did, what you expected, and what occurred.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spark version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [CLI, Dashboard (web), Desktop app, Gateway / messaging, Cron / Kanban, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove API keys and personal data first.
      render: text
